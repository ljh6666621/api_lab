<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>即时通讯</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #0f172a; background: #f1f5f9; }
  #app { display: flex; flex-direction: column; height: 100%; }

  .top-nav {
    background: linear-gradient(135deg, #1e1b4b 0%, #6366f1 55%, #06b6d4 100%);
    display:flex; align-items:center; justify-content:space-between; padding:14px 32px;
    color:#fff; position:sticky; top:0; z-index:999; box-shadow:0 6px 16px rgba(99,102,241,.18);
    flex-shrink: 0;
  }
  .top-nav .logo { font-size:18px; font-weight:700; letter-spacing:.5px; }
  .top-nav .tabs { display:flex; gap:6px; margin-left:24px; flex-wrap:wrap; }
  .top-nav .tabs a {
    padding:8px 14px; border-radius:8px; color:rgba(255,255,255,.8); text-decoration:none;
    font-size:13px; font-weight:500; transition:all .2s; border:1px solid transparent;
  }
  .top-nav .tabs a:hover { background:rgba(255,255,255,.12); color:#fff; }
  .top-nav .tabs a.active {
    background:rgba(255,255,255,.22); color:#fff; border-color:rgba(255,255,255,.4);
    backdrop-filter: blur(6px);
  }
  .top-nav .auth { display:flex; align-items:center; gap:8px; }
  .top-nav .auth input[type=password] {
    padding:7px 12px; width:280px; border-radius:8px; border:none; background:rgba(255,255,255,.15);
    color:#fff; font-size:13px; outline:none; transition:.2s;
  }
  .top-nav .auth input[type=password]::placeholder { color:rgba(255,255,255,.7); }
  .top-nav .auth input[type=password]:focus { background:rgba(255,255,255,.25); }
  .top-nav .auth button {
    padding:7px 14px; border-radius:8px; border:none; background:#fff; color:#6366f1;
    font-weight:600; font-size:13px; cursor:pointer; transition:.2s;
  }
  .top-nav .auth button:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.12); }
  .top-nav .auth .me { font-size:12px; color:rgba(255,255,255,.85); margin-right:6px; }
  .top-nav .auth .logout {
    background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4); padding:6px 10px;
  }
  .toast {
    position:fixed; bottom:32px; right:32px; padding:12px 18px; border-radius:10px; background:#1e1b4b; color:#fff;
    font-size:13px; z-index:9999; box-shadow:0 12px 24px rgba(0,0,0,.2); opacity:0; transform:translateY(8px); transition:.28s;
  }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.ok { background:#166534; }
  .toast.err { background:#991b1b; }

  .im-title-bar {
    padding:10px 24px; background:#f8fafc; border-bottom:1px solid #e2e8f0;
    font-weight:700; color:#1e1b4b; flex-shrink:0;
  }

  main.body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  aside.sidebar {
    flex: 0 0 30%;
    border-right: 1px solid #e2e8f0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  aside.sidebar .toolbar {
    padding: 10px 14px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  aside.sidebar .toolbar input, aside.sidebar .toolbar select {
    flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; outline: none;
  }
  aside.sidebar .toolbar input:focus, aside.sidebar .toolbar select:focus { border-color: #10b981; }
  aside.sidebar .toolbar .new-btn {
    padding: 6px 12px; border-radius: 6px; background: linear-gradient(90deg,#0ea5e9,#10b981); color:#fff;
    border: none; cursor: pointer; font-size: 13px;
  }
  aside.sidebar .conv-list { flex: 1; overflow-y: auto; }
  .conv-item {
    padding: 12px 14px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    transition: background .15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .conv-item:hover { background: #f8fafc; }
  .conv-item.active { background: linear-gradient(90deg, rgba(14,165,233,0.08), rgba(16,185,129,0.08)); border-left: 3px solid #10b981; padding-left: 11px; }
  .conv-item .title { font-size: 14px; font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 6px;}
  .conv-item .title .badge {
    display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: 500;
    background: #e0f2fe; color: #0369a1;
  }
  .conv-item .title .badge.group { background: #ecfccb; color: #4d7c0f; }
  .conv-item .title .badge.employee { background: #ede9fe; color: #6d28d9; }
  .conv-item .meta { font-size: 12px; color: #64748b; display: flex; justify-content: space-between; }
  .conv-item .preview { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

  section.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #f8fafc;
    overflow: hidden;
  }
  section.chat .chat-header {
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  section.chat .chat-header h2 { font-size: 16px; font-weight: 600; }
  section.chat .chat-header .count { font-size: 12px; color: #64748b; }
  section.chat .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  section.chat .messages .empty {
    margin: auto; color: #94a3b8; font-size: 13px;
  }
  .msg { display: flex; max-width: 72%; gap: 8px; }
  .msg .avatar {
    flex: 0 0 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
  }
  .msg .bubble-wrap { display: flex; flex-direction: column; gap: 3px; }
  .msg .sender { font-size: 11px; color: #94a3b8; }
  .msg .bubble {
    padding: 8px 14px;
    border-radius: 10px;
    line-height: 1.55;
    font-size: 14px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg .time { font-size: 11px; color: #94a3b8; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg.me .avatar { background: linear-gradient(135deg, #0ea5e9, #10b981); }
  .msg.me .bubble-wrap { align-items: flex-end; }
  .msg.me .bubble {
    background: linear-gradient(135deg, #0ea5e9, #10b981);
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg.me .sender { text-align: right; }
  .msg.other .avatar { background: #94a3b8; }
  .msg.other.employee .avatar { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
  .msg.other .bubble { background: #e2e8f0; color: #0f172a; border-bottom-left-radius: 2px; }

  section.chat .input-area {
    padding: 12px 20px;
    border-top: 1px solid #e2e8f0;
    background: #fff;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  section.chat .input-area textarea {
    flex: 1;
    resize: none;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    height: 64px;
    font-family: inherit;
    line-height: 1.5;
  }
  section.chat .input-area textarea:focus { border-color: #10b981; }
  section.chat .input-area button {
    padding: 0 22px;
    height: 44px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(90deg, #0ea5e9, #10b981);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  section.chat .input-area button:hover { opacity: 0.94; }
  section.chat .input-area button:active { transform: scale(0.98); }
  section.chat .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-hint {
    font-size: 11px;
    color: #64748b;
    padding: 4px 20px;
    background: #fff;
    border-top: 1px dashed #e2e8f0;
    display: flex;
    justify-content: space-between;
  }
  .status-hint .ws.ok { color: #16a34a; }
  .status-hint .ws.bad { color: #dc2626; }
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:9999;display:none;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:14px;width:380px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,0.25);overflow:hidden;}
.modal h3{padding:18px 22px 10px;font-size:17px;color:#1e1b4b;background:linear-gradient(90deg,rgba(99,102,241,0.1),rgba(6,182,212,0.08));margin:0;border-bottom:1px solid #eef2ff;}
.modal .mbody{padding:20px 22px 12px;display:flex;flex-direction:column;gap:12px;}
.modal label{font-size:12px;color:#475569;font-weight:600;}
.modal input{padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;outline:none;}
.modal input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
.modal .mfoot{padding:12px 22px 20px;display:flex;gap:10px;justify-content:flex-end;}
.modal button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;}
.modal .btn-cancel{background:#f1f5f9;color:#475569;}
.modal .btn-ok{background:linear-gradient(90deg,#6366f1,#06b6d4);color:#fff;}
.modal .tip{font-size:12px;color:#94a3b8;line-height:1.5;padding:2px 2px;}
.auth .login-btn{background:rgba(255,255,255,0.22);border:none;padding:5px 14px;border-radius:6px;color:#fff;cursor:pointer;font-size:13px;}
.auth .login-btn:hover{background:rgba(255,255,255,0.32);}
</style>
</head>
<body>
<div id="app">

  <nav class="top-nav">
    <div style="display:flex;align-items:center;">
      <div class="logo">☖ 企业智能协同平台</div>
      <div class="tabs">
        <a href="/static/portal.html">工作台</a>
        <a href="/static/pipelines.html">采集</a>
        <a href="/static/assets.html">资产</a>
        <a href="/static/index.html">问数</a>
        <a href="/static/im.html">通讯</a>
        <a href="/static/employees.html">员工</a>
        <a href="/static/modelskills.html">模型</a>
      </div>
    </div>
    <div class="auth">
      <span class="me" id="currentUser">未登录</span>
      <input id="apiToken" type="password" placeholder="粘贴 JWT Token (登录获取)" />
      <button class="login-btn" onclick="showLogin()">登录</button>
      <button onclick="saveToken()">应用</button>
      <button class="logout" onclick="clearToken()">退出</button>
    </div>
  </nav>

  <div class="im-title-bar">💡 即时通讯 · 单聊 / 群聊 / 数字员工</div>

  <main class="body">
    <aside class="sidebar">
      <div class="toolbar">
        <select id="newConvType">
          <option value="single">单聊</option>
          <option value="group">群聊</option>
          <option value="employee">数字员工</option>
        </select>
        <input id="newConvMembers" type="text" placeholder="用户ID，逗号分隔" />
        <button class="new-btn" id="newConvBtn">新建</button>
      </div>
      <div class="conv-list" id="convList"></div>
    </aside>

    <section class="chat">
      <div class="chat-header">
        <div>
          <h2 id="chatTitle">请选择一个会话开始聊天</h2>
          <div class="count" id="chatCount"></div>
        </div>
        <div style="font-size:12px;color:#64748b;" id="chatConvId"></div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="status-hint">
        <span>连接状态: <b id="wsState" class="ws bad">未连接 (轮询模式)</b></span>
        <span id="lastSync"></span>
      </div>
      <div class="input-area">
        <textarea id="inputBox" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea>
        <button id="sendBtn" disabled>发送</button>
      </div>
    </section>
  </main>
</div>

<script>
const CURRENT_PAGE = "im";
(function markActiveTab() {
  const map = { portal:"工作台", pipelines:"采集", assets:"资产", index:"问数", im:"通讯", employees:"员工", modelskills:"模型" };
  const label = map[CURRENT_PAGE] || "";
  document.querySelectorAll('.top-nav .tabs a').forEach(a => {
    if (a.textContent.trim() === label) a.classList.add('active');
  });
})();

window.refreshLoginBtnVisibility = function() {
  document.querySelectorAll('.login-btn').forEach(function(b) {
    const u = document.getElementById('currentUser');
    const label = u ? (u.textContent || '') : '';
    const logged = !!(getToken() && label && !label.includes('未登录') && !label.includes('无效') && !label.includes('Token'));
    b.style.display = logged ? 'none' : '';
  });
};
function getToken() { return localStorage.getItem('api_token') || ''; }
function saveToken() {
  const v = document.getElementById('apiToken').value.trim();
  if (!v) { alert('请先粘贴 JWT Token（从 /users/login 登录响应的 access_token 获取）'); return; }
  localStorage.setItem('api_token', v);
  loadMe(); toast('Token 已保存', 'ok');
  TOKEN = v;
  conversations = [];
  activeConvId = null;
  renderConvList();
  renderChatPanel();
  bootstrap();
  TOKEN = getToken();
  try{ if(typeof refreshConversations === 'function') refreshConversations().catch(()=>{}); if(typeof connectWS==='function' && !ws) connectWS(); if(typeof startPolling==='function') startPolling(); }catch(_){}
  window.refreshLoginBtnVisibility && window.refreshLoginBtnVisibility();
}
function clearToken() { localStorage.removeItem('api_token'); document.getElementById('apiToken').value=''; document.getElementById('currentUser').textContent='未登录'; toast('已退出登录'); window.refreshLoginBtnVisibility && window.refreshLoginBtnVisibility(); }
function authHeaders(h={}) { const t = getToken(); return Object.assign({'Content-Type':'application/json'}, t ? { 'Authorization':'Bearer '+t } : {}, h); }
async function api2(path, opts={}) {
  const res = await fetch(path, Object.assign({ headers: authHeaders(opts.body && !(opts.body instanceof FormData) ? {} : opts.headers || {}) }, opts));
  if (res.status === 401) { toast('登录已过期或 Token 无效，请重新登录', 'err'); throw new Error('Unauthorized'); }
  if (!res.ok) { const t = await res.text(); throw new Error(t || ('HTTP ' + res.status)); }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}
async function loadMe() {
  const inp = document.getElementById('apiToken'); if (inp) inp.value = getToken();
  if (!getToken()) { window.refreshLoginBtnVisibility && window.refreshLoginBtnVisibility(); return; }
  try { const u = await api2('/users/me'); if (u && u.username) document.getElementById('currentUser').textContent = '👤 '+u.username + (u.dept_name?' · '+u.dept_name:''); }
  catch(e) { document.getElementById('currentUser').textContent = 'Token 无效'; }
  window.refreshLoginBtnVisibility && window.refreshLoginBtnVisibility();
}
function toast(msg, type='') {
  let d = document.createElement('div'); d.className = 'toast ' + type; d.textContent = msg; document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show')); setTimeout(()=>{ d.classList.remove('show'); setTimeout(()=>d.remove(), 300); }, 2600);
}
function urlParam(k) { return new URLSearchParams(location.search).get(k); }

function showLogin(){ const m=document.getElementById('loginModal'); if(m) m.classList.add('show'); }
function hideLogin(){ const m=document.getElementById('loginModal'); if(m) m.classList.remove('show'); }
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  if(!u||!p){ alert('请输入用户名和密码'); return; }
  try{
    const fd=new FormData(); fd.append('username',u); fd.append('password',p);
    const res=await fetch('/users/login',{method:'POST',body:fd});
    if(!res.ok){ const t=await res.text(); toast('登录失败: '+(t||'HTTP '+res.status),'err'); return; }
    const data=await res.json();
    const tok=data&&(data.access_token||data.token);
    if(!tok){ toast('登录响应缺少 token','err'); return; }
    const inp=document.getElementById('apiToken'); if(inp) inp.value=tok;
    hideLogin(); saveToken();
    document.getElementById('loginUser').value='';
    document.getElementById('loginPass').value='';
  }catch(e){ toast('登录异常: '+e.message,'err'); }
}

  const API = "/im";
  let TOKEN = getToken();
  let conversations = [];
  let activeConvId = null;
  let lastMsgIdByConv = {};
  let ws = null;
  let pollTimer = null;
  let employeeIdPending = null;

  const $ = (id) => document.getElementById(id);

  function oldAuthHeaders() {
    return {
      "Authorization": "Bearer " + TOKEN,
      "Content-Type": "application/json",
    };
  }

  async function api(method, url, body) {
    const opts = { method, headers: oldAuthHeaders() };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).message || msg; } catch(_) {}
      throw new Error(`${res.status} ${msg}`);
    }
    return res.json();
  }

  function initialsFor(name) {
    if (!name) return "?";
    return name.trim().slice(0, 1).toUpperCase();
  }

  function renderConvList() {
    const list = $("convList");
    if (!TOKEN) {
      list.innerHTML = '<div class="conv-item"><div class="title" style="color:#94a3b8;">请先在右上角填写 Token 并点击"应用/刷新"</div></div>';
      return;
    }
    if (!conversations.length) {
      list.innerHTML = '<div class="conv-item"><div class="title" style="color:#94a3b8;">暂无会话，使用左上方工具栏新建</div></div>';
      return;
    }
    list.innerHTML = conversations.map(c => {
      const activeCls = c.id === activeConvId ? " active" : "";
      const badgeCls = c.type === "group" ? "group" : (c.type === "employee" ? "employee" : "");
      const title = c.name || (c.type === "single" ? "单聊会话" : (c.type === "group" ? "群聊" : "数字员工对话"));
      const preview = c.last_message || "暂无消息";
      return `
        <div class="conv-item${activeCls}" data-id="${c.id}">
          <div class="title">
            <span class="badge ${badgeCls}">${c.type}</span>
            <span>${title}</span>
          </div>
          <div class="meta">
            <span>成员 ${c.members_count} 人</span>
            <span>${new Date(c.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
          </div>
          <div class="preview">${preview}</div>
        </div>
      `;
    }).join("");
    list.querySelectorAll(".conv-item").forEach(el => {
      el.addEventListener("click", () => selectConv(parseInt(el.dataset.id)));
    });
  }

  function renderChatPanel() {
    const titleEl = $("chatTitle");
    const countEl = $("chatCount");
    const idEl = $("chatConvId");
    const input = $("inputBox");
    const btn = $("sendBtn");

    if (!activeConvId) {
      titleEl.textContent = "请选择一个会话开始聊天";
      countEl.textContent = "";
      idEl.textContent = "";
      $("messages").innerHTML = '<div class="empty">— 选择左侧会话以查看消息 —</div>';
      input.disabled = true;
      btn.disabled = true;
      return;
    }
    const c = conversations.find(x => x.id === activeConvId);
    if (!c) return;
    titleEl.textContent = c.name || (c.type === "single" ? "单聊会话" : (c.type === "group" ? "群聊" : "数字员工对话"));
    countEl.textContent = `${c.members_count} 位成员 · ${c.type}`;
    idEl.textContent = `#${c.id}`;
    input.disabled = false;
    btn.disabled = false;
  }

  function renderMessages(messages) {
    const box = $("messages");
    if (!messages || !messages.length) {
      box.innerHTML = '<div class="empty">— 暂无消息，发送第一条吧 —</div>';
      return;
    }
    box.innerHTML = messages.map(m => {
      const isMe = !!(m.sender_id && (m.sender_id !== 0));
      const sideCls = isMe ? "me" : "other";
      const employeeCls = (m.sender_id === 0) ? " employee" : "";
      const senderName = m.sender_name || ((m.sender_id === 0) ? "数字员工" : "用户");
      const avatar = (m.sender_id === 0) ? "AI" : initialsFor(senderName);
      const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) : "";
      return `
        <div class="msg ${sideCls}${employeeCls}">
          <div class="avatar">${avatar}</div>
          <div class="bubble-wrap">
            <div class="sender">${senderName}</div>
            <div class="bubble">${escapeHtml(m.content)}</div>
            <div class="time">${time}</div>
          </div>
        </div>
      `;
    }).join("");
    try {
      const sub = parseJwtSub();
      if (sub) {
        box.querySelectorAll(".msg").forEach((el, i) => {
          const m = messages[i];
          if (m.sender_id && parseInt(m.sender_id) === parseInt(sub)) {
            el.classList.remove("other");
            el.classList.add("me");
            const av = el.querySelector(".avatar");
            av.style.background = "linear-gradient(135deg, #0ea5e9, #10b981)";
          } else if (m.sender_id === 0) {
            el.classList.add("employee");
          }
        });
      }
    } catch(_) {}
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[ch]));
  }

  function parseJwtSub() {
    try {
      const parts = TOKEN.split(".");
      if (parts.length < 2) return null;
      const payload = JSON.parse(atob(parts[1].replace(/-/g,"+").replace(/_/g,"/")));
      const sub = payload.sub;
      return sub == null ? null : parseInt(sub);
    } catch(_) { return null; }
  }

  async function refreshConversations() {
    try {
      const list = await api("GET", API + "/conversations");
      conversations = list || [];
      renderConvList();
      if (employeeIdPending) {
        const existing = conversations.find(c => c.type === "employee");
        if (existing) {
          await selectConv(existing.id);
          toast(`已打开与员工 #${employeeIdPending} 的会话`);
          employeeIdPending = null;
        }
      }
    } catch (e) {
      console.error("加载会话失败", e);
      alert("加载会话失败: " + e.message);
    }
  }

  async function selectConv(id) {
    activeConvId = id;
    renderConvList();
    renderChatPanel();
    $("messages").innerHTML = '<div class="empty">加载中...</div>';
    try {
      const [detail, messages] = await Promise.all([
        api("GET", API + `/conversations/${id}`),
        api("GET", API + `/conversations/${id}/messages?limit=100`),
      ]);
      const idx = conversations.findIndex(c => c.id === id);
      if (idx >= 0) conversations[idx] = Object.assign({}, conversations[idx], detail);
      renderConvList();
      if (messages && messages.length) {
        lastMsgIdByConv[id] = messages[messages.length - 1].id;
      }
      renderMessages(messages);
    } catch (e) {
      $("messages").innerHTML = `<div class="empty" style="color:#dc2626;">加载消息失败: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function sendMessage() {
    if (!activeConvId) return;
    const box = $("inputBox");
    const content = box.value.trim();
    if (!content) return;
    $("sendBtn").disabled = true;
    try {
      const resp = await api("POST", API + `/conversations/${activeConvId}/messages`, { content, msg_type: "text" });
      box.value = "";
      const added = [];
      if (resp.user) added.push(resp.user);
      if (resp.reply) added.push(resp.reply);
      if (added.length) {
        const messages = await api("GET", API + `/conversations/${activeConvId}/messages?limit=100`);
        if (messages && messages.length) {
          lastMsgIdByConv[activeConvId] = messages[messages.length - 1].id;
        }
        renderMessages(messages);
      }
      await refreshConversations();
    } catch (e) {
      alert("发送失败: " + e.message);
    } finally {
      $("sendBtn").disabled = false;
      box.focus();
    }
  }

  async function newConversation() {
    const type = $("newConvType").value;
    const membersRaw = $("newConvMembers").value.trim();
    let members = [];
    if (membersRaw) {
      members = membersRaw.split(/[,，\s]+/).map(s => parseInt(s)).filter(n => !isNaN(n));
    }
    const sub = parseJwtSub();
    try {
      if (type === "single") {
        if (members.length !== 2) {
          if (members.length === 1 && sub) {
            members = [sub, members[0]];
          } else {
            alert("单聊需要正好两个用户ID（可只输入对方ID，自动补当前用户）");
            return;
          }
        }
        const conv = await api("POST", API + "/conversations", { conv_type: "single", members });
        await refreshConversations();
        selectConv(conv.id);
      } else if (type === "group") {
        const name = prompt("群聊名称（可为空）：", "");
        if (!members.length && sub) members = [sub];
        const conv = await api("POST", API + "/conversations", { conv_type: "group", name, members });
        await refreshConversations();
        selectConv(conv.id);
      } else if (type === "employee") {
        const empIdStr = prompt("请输入数字员工ID：", members[0] != null ? members[0]+"" : "");
        if (!empIdStr) return;
        const empId = parseInt(empIdStr);
        if (isNaN(empId)) { alert("数字员工ID必须是数字"); return; }
        const conv = await api("POST", API + "/conversations", {
          conv_type: "employee",
          employee_id: empId,
          members: sub ? [sub] : [],
        });
        await refreshConversations();
        selectConv(conv.id);
      }
    } catch (e) {
      alert("新建会话失败: " + e.message);
    }
  }

  async function pollNewMessages() {
    if (!activeConvId || !TOKEN) return;
    try {
      const params = new URLSearchParams();
      params.set("limit", "50");
      const messages = await api("GET", API + `/conversations/${activeConvId}/messages?limit=50`);
      const lastLocal = lastMsgIdByConv[activeConvId] || 0;
      const newer = messages.filter(m => m.id > lastLocal);
      if (newer.length) {
        renderMessages(messages);
      }
      if (messages && messages.length) {
        lastMsgIdByConv[activeConvId] = messages[messages.length - 1].id;
      }
      $("lastSync").textContent = "最后同步: " + new Date().toLocaleTimeString('zh-CN');
    } catch (e) {
      console.warn("轮询出错", e);
    }
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      pollNewMessages();
      if (!window.__pollCnt) window.__pollCnt = 0;
      window.__pollCnt++;
      if (window.__pollCnt % 5 === 0) refreshConversations().catch(()=>{});
    }, 3000);
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function connectWS() {
    if (!TOKEN) return;
    try {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const url = `${proto}//${location.host}/im/ws?token=${encodeURIComponent(TOKEN)}`;
      ws = new WebSocket(url);
      ws.addEventListener("open", () => {
        $("wsState").textContent = "WebSocket 已连接";
        $("wsState").className = "ws ok";
      });
      ws.addEventListener("close", () => {
        $("wsState").textContent = "未连接 (轮询模式)";
        $("wsState").className = "ws bad";
        setTimeout(connectWS, 4000);
      });
      ws.addEventListener("error", () => { try { ws.close(); } catch(_){} });
      ws.addEventListener("message", async (evt) => {
        try {
          const data = JSON.parse(evt.data);
          if (data.type === "message" && data.message && data.conv_id) {
            if (data.conv_id === activeConvId) {
              const messages = await api("GET", API + `/conversations/${activeConvId}/messages?limit=100`);
              if (messages && messages.length) {
                lastMsgIdByConv[activeConvId] = messages[messages.length - 1].id;
              }
              renderMessages(messages);
            }
            refreshConversations().catch(()=>{});
          }
        } catch(_) {}
      });
    } catch(e) {
      $("wsState").textContent = "未连接 (轮询模式)";
      $("wsState").className = "ws bad";
    }
  }

  async function handleEmployeeParam() {
    const eidStr = urlParam('employee_id');
    if (!eidStr) return;
    const eid = parseInt(eidStr);
    if (isNaN(eid)) return;
    if (!TOKEN) {
      toast('请先应用 Token 后再打开员工会话', 'err');
      return;
    }
    const sub = parseJwtSub();
    employeeIdPending = eid;
    try {
      const conv = await api("POST", API + "/conversations", {
        conv_type: "employee",
        name: "与员工#" + eid + "对话",
        members: sub ? [sub] : [],
        employee_id: eid,
      });
      employeeIdPending = null;
      await refreshConversations();
      await selectConv(conv.id);
      toast(`已打开与员工 #${eid} 的会话`, 'ok');
    } catch (e) {
      console.warn('创建员工会话失败，尝试查找已有', e);
      employeeIdPending = eid;
      await refreshConversations();
    }
  }

  function bootstrap() {
    if (!TOKEN) return;
    refreshConversations().then(() => {
      setTimeout(handleEmployeeParam, 100);
    });
    startPolling();
    connectWS();
  }

  $("newConvBtn").addEventListener("click", newConversation);
  $("sendBtn").addEventListener("click", sendMessage);
  $("inputBox").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  window.addEventListener("load", () => {
    const apiInp = $("apiToken");
    if (apiInp) apiInp.value = TOKEN;
    loadMe();
    renderConvList();
    renderChatPanel();
    if (TOKEN) bootstrap();
  });
</script>
<div id="loginModal" class="modal-mask" onclick="if(event.target===this)hideLogin()">
  <div class="modal">
    <h3>🔐 用户登录 · 获取 JWT Token</h3>
    <div class="mbody">
      <div>
        <label>用户名 / 邮箱</label>
        <input id="loginUser" type="text" placeholder="例如 admin 或你的邮箱" autocomplete="username" />
      </div>
      <div>
        <label>密码</label>
        <input id="loginPass" type="password" placeholder="你的登录密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <div class="tip">登录成功后将自动调用 POST /users/login，读取响应中的 access_token 并保存到全局 localStorage（7 页共享）。</div>
    </div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="hideLogin()">取消</button>
      <button class="btn-ok" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>
</body>
</html>
